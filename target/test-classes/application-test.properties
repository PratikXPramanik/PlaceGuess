spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Redis for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app.jwt.secret=TestSecretKeyForPlaceGuessApplicationTestingPurposesOnly1234
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.google.maps.api-key=TEST_API_KEY
app.game.max-distance-km=5000
app.game.round-time-seconds=60
app.game.rounds-per-game=5
app.cache.leaderboard-ttl=300
