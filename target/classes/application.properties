spring.application.name=placeguess

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── MySQL ────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/placeguess_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Pp@9890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=ThisIsAVeryLongAndSecureSecretKeyForPlaceGuessJWTTokenGeneration2024!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── Google Maps / Street View ────────────────────────────────────────────────
app.google.maps.api-key=AIzaSyDdn49u8VfFfMOVpnMDiN7KQWYHFVeJjzs

# ─── Game Config ──────────────────────────────────────────────────────────────
app.game.max-distance-km=5000
app.game.round-time-seconds=60
app.game.rounds-per-game=5

# ─── Leaderboard Cache (seconds) ──────────────────────────────────────────────
app.cache.leaderboard-ttl=300
